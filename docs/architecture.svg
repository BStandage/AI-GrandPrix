<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-label="system architecture"><style>
  svg { background: #0d0f12; font-family: Inter, system-ui, sans-serif; }
  .abox { fill: #15181d; stroke: #2a2f38; stroke-width: 1.2; }
  .abox.red { stroke: #e5322d; } .abox.amber { stroke: #f2b134; }
  .atitle { fill: #e9ecf1; font-size: 15px; font-weight: 700; }
  .aline { fill: #a4abb8; font-size: 12.5px; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
  .alane { fill: none; stroke: #2a2f38; stroke-dasharray: 6 5; }
  .alanetitle { fill: #ff6b66; font-size: 12px; letter-spacing: 0.08em; font-family: ui-monospace, Consolas, monospace; }
  .aarrow { fill: none; stroke: #a4abb8; stroke-width: 1.6; } .aarrow.dashed { stroke-dasharray: 5 4; }
  .ahead { fill: #a4abb8; } .alabel { fill: #a4abb8; font-size: 11.5px; font-family: ui-monospace, Consolas, monospace; }
</style><defs><marker id="ahead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="ahead"></path></marker></defs><rect x="16" y="16" width="1368" height="174" rx="16" class="alane"></rect><text x="32" y="40" class="alanetitle">BEFORE FLIGHT · laptop</text><rect x="16" y="210" width="1368" height="470" rx="16" class="alane"></rect><text x="32" y="234" class="alanetitle">IN FLIGHT · Jetson Orin, 50 Hz control loop, Python</text><rect x="16" y="700" width="1368" height="184" rx="16" class="alane"></rect><text x="32" y="724" class="alanetitle">AROUND IT</text><g transform="translate(40 56)"><rect width="280" height="95" rx="12" class="abox "></rect><text x="16" y="26" class="atitle">Published course map</text><text x="16" y="48" class="aline">10 gates: position, crossing</text><text x="16" y="65" class="aline">heading, opening height; one</text><text x="16" y="82" class="aline">stacked gate (4.05 m / 1.35 m)</text></g><g transform="translate(350 56)"><rect width="300" height="95" rx="12" class="abox "></rect><text x="16" y="26" class="atitle">Vehicle config</text><text x="16" y="48" class="aline">camera: tilt, FOV, focal length</text><text x="16" y="65" class="aline">limits: lean 8°, speed 1.5 m/s,</text><text x="16" y="82" class="aline">climb rate, margin; ladder k</text></g><g transform="translate(680 56)"><rect width="290" height="112" rx="12" class="abox red"></rect><text x="16" y="26" class="atitle">Planner</text><text x="16" y="48" class="aline">fastest line through the</text><text x="16" y="65" class="aline">crossings inside the limits;</text><text x="16" y="82" class="aline">refuses lines that lose the</text><text x="16" y="99" class="aline">camera or touch a frame</text></g><g transform="translate(1000 56)"><rect width="330" height="112" rx="12" class="abox "></rect><text x="16" y="26" class="atitle">Plan</text><text x="16" y="48" class="aline">505 samples: x y z, speed,</text><text x="16" y="65" class="aline">heading; 23 crossings / 2 laps</text><text x="16" y="82" class="aline">251 m; frame: start line,</text><text x="16" y="99" class="aline">+y down gate 0</text></g><g><path d="M 320 110 L 348 110" class="aarrow " marker-end="url(#ahead)"></path></g><g><path d="M 650 110 L 678 110" class="aarrow " marker-end="url(#ahead)"></path></g><g><path d="M 970 110 L 998 110" class="aarrow " marker-end="url(#ahead)"></path></g><g transform="translate(40 256)"><rect width="290" height="129" rx="12" class="abox "></rect><text x="16" y="26" class="atitle">Flight controller</text><text x="16" y="48" class="aline">Betaflight, MSP serial, ~32 Hz</text><text x="16" y="65" class="aline">attitude, heading</text><text x="16" y="82" class="aline">accelerometer (body frame)</text><text x="16" y="99" class="aline">barometer</text><text x="16" y="116" class="aline">ANGLE mode, MSP override on</text></g><g transform="translate(40 430)"><rect width="290" height="163" rx="12" class="abox amber"></rect><text x="16" y="26" class="atitle">Camera · IMX477</text><text x="16" y="48" class="aline">1920×1080 @ 60 fps, GStreamer</text><text x="16" y="65" class="aline">resized to 1280×720</text><text x="16" y="82" class="aline">HSV detector:</text><text x="16" y="99" class="aline">  ring bbox, opening centre</text><text x="16" y="116" class="aline">  offsets −1..+1, width range</text><text x="16" y="133" class="aline">  clipped-ring rebuild</text><text x="16" y="150" class="aline">  commit rule</text></g><g transform="translate(400 256)"><rect width="340" height="180" rx="12" class="abox red"></rect><text x="16" y="26" class="atitle">Estimator</text><text x="16" y="48" class="aline">vision-aided dead reckoning</text><text x="16" y="65" class="aline">accel on attitude, gravity removed,</text><text x="16" y="82" class="aline">  integrated → velocity, position</text><text x="16" y="99" class="aline">pad-learned accel bias subtracted</text><text x="16" y="116" class="aline">gate fix: map gate − range along</text><text x="16" y="133" class="aline">  bearing; strong across, weak along</text><text x="16" y="150" class="aline">crossings counted 0.75 m past plane</text><text x="16" y="167" class="aline">heading: FC yaw at arm + drift rate</text></g><g transform="translate(800 256)"><rect width="560" height="231" rx="12" class="abox "></rect><text x="16" y="26" class="atitle">Follower</text><text x="16" y="48" class="aline">TRACKER   plan point ahead → position/velocity</text><text x="16" y="65" class="aline">  error → world acceleration → ANGLE roll/pitch</text><text x="16" y="82" class="aline">  (lean cap 8°); last 6 m on the gate centre line</text><text x="16" y="99" class="aline">VERTICAL  gate elevation (attitude-corrected)</text><text x="16" y="116" class="aline">  → height reference 0.09 m/deg, cap 0.20 m</text><text x="16" y="133" class="aline">  before gate 0, 0.35 m after; damped on a vz</text><text x="16" y="150" class="aline">COMMIT    ring ≥ 85 % ×3 or both edges clip;</text><text x="16" y="167" class="aline">  within 6 m, aligned, level → no fixes, height</text><text x="16" y="184" class="aline">  frozen, hold throttle; forced at 3.2 m</text><text x="16" y="201" class="aline">THRUST    acceleration → throttle µs; hover</text><text x="16" y="218" class="aline">  measured in flight (D43: 1205 µs)</text></g><g transform="translate(800 560)"><rect width="560" height="78" rx="12" class="abox "></rect><text x="16" y="26" class="atitle">Stick commands · 50 Hz</text><text x="16" y="48" class="aline">roll, pitch, yaw, throttle over MSP</text><text x="16" y="65" class="aline">trace and narration logged every tick</text></g><g><path d="M 330 300 L 398 300" class="aarrow " marker-end="url(#ahead)"></path><text x="364" y="290" class="alabel" text-anchor="middle">IMU, baro</text></g><g><path d="M 330 480 L 372 480 L 372 400 L 398 400" class="aarrow " marker-end="url(#ahead)"></path><text x="340" y="504" class="alabel" text-anchor="start">detections</text></g><g><path d="M 740 330 L 798 330" class="aarrow " marker-end="url(#ahead)"></path><text x="769" y="320" class="alabel" text-anchor="middle">state</text></g><g><path d="M 1165 170 L 1165 254" class="aarrow " marker-end="url(#ahead)"></path><text x="1174" y="216" class="alabel" text-anchor="start">plan</text></g><g><path d="M 1080 489 L 1080 558" class="aarrow " marker-end="url(#ahead)"></path></g><g><path d="M 800 610 L 358 610 L 358 350 L 332 350" class="aarrow " marker-end="url(#ahead)"></path><text x="560" y="630" class="alabel" text-anchor="start">stick values, MSP override</text></g><g transform="translate(40 740)"><rect width="400" height="95" rx="12" class="abox "></rect><text x="16" y="26" class="atitle">Pilot · radio</text><text x="16" y="48" class="aline">throttle low → ARM → MSP OVERRIDE → ANGLE</text><text x="16" y="65" class="aline">abort: MSP OVERRIDE off, instant handback</text><text x="16" y="82" class="aline">any pilot input ends the scored run</text></g><g transform="translate(470 740)"><rect width="470" height="112" rx="12" class="abox amber"></rect><text x="16" y="26" class="atitle">Simulator</text><text x="16" y="48" class="aline">Elodin physics + Betaflight SITL, Docker</text><text x="16" y="65" class="aline">same estimator and follower code</text><text x="16" y="82" class="aline">synthetic camera: dropout, noise, latency,</text><text x="16" y="99" class="aline">false positives; referee scores crossings</text></g><g transform="translate(970 740)"><rect width="390" height="95" rx="12" class="abox "></rect><text x="16" y="26" class="atitle">Debrief tools</text><text x="16" y="48" class="aline">pull_flight: log + narration off the aircraft</text><text x="16" y="65" class="aline">triage: runaway, commit and link checks</text><text x="16" y="82" class="aline">this page: traces drawn from the same logs</text></g></svg>