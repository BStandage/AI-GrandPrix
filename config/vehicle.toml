# config/vehicle.toml - THE tuning surface for the racing-line stack.
#
# Planner (raceline.planner) and follower (solvers.follower) read ONLY this
# file. No vehicle number is hardcoded anywhere else. Every parameter is
# GLOBAL: there is no way to express a per-gate value here, by design
# (RESTRICTIONS.md).
#
# Seeds: hover_pwm is measured on the elodin SITL plant; everything else is a
# conservative starting point for the first 24/24 confirmation flight. Tune by
# editing this file and re-running race.py - nothing else.

[meta]
name    = "elodin-sitl-quad"        # becomes "neros-..." when day-1 sysid lands
updated = "2026-08-28"

[vehicle]                 # physical truth - sysid replaces this section wholesale
mass_kg   = 0.9           # seeded from sim/config.py
drag_lin  = 0.0           # N per (m/s) - unmeasured, 0 until a sim sweep exists
drag_quad = 0.0           # N per (m/s)^2

[thrust]
hover_pwm = 1240          # measured steady-state hover RC on the SITL plant
pwm_min   = 1000
pwm_max   = 2000          # was 1600 (wobble-era cap, never measured); full range,
                          # real ceiling comes from solvers.sysid_thrust
# Thrust curve, pwm -> vertical accel (m/s^2). PLACEHOLDER 3-point
# linearization around hover; replace with the FAQ thrust/accel data or a
# measured sweep. Not consumed by the v1 planner (it uses the a_accel/a_brake
# scalars below) - the slot exists for exactly that swap.
curve_pwm = [1350, 1500, 1650, 1800, 2000]
curve_acc = [13.88, 19.32, 23.44, 26.25, 29.21]   # MEASURED, drag-fixed plant (sysid_thrust run 1)

[limits]                  # ceilings shared by planner AND follower
max_tilt_deg     = 40.0   # RAISED 22 -> 30 -> 40 across the tuning effort.
                          # This is the follower's real-time correction
                          # clamp (a_lat_full = g*tan(this)): 3.96 -> 5.66
                          # -> 8.23 m/s^2. More lean = more authority to
                          # pull back onto the line mid-curve, which is
                          # what let the gate crossings hold steady while
                          # speed went up 1.5x. Thrust supports it: holding
                          # altitude at 40 deg needs 1/cos(40) = 1.31x
                          # hover, fine at the measured TWR ~3.
                          # Direction matters - LOWERING this to 16 was
                          # tried early on and caused a NEW crash at g8,
                          # because it cuts that same authority.
                          # NOTE follower.stick_clamp was raised to 250 in
                          # step: at ka_att 300 a 40 deg command needs
                          # ~192 PWM, so the old clamp of 150 would have
                          # stopped the follower delivering what the
                          # planner assumes here.
                          # CAVEAT: sim_lite has no attitude dynamics, so
                          # it cannot confirm 40 deg is actually reachable
                          # on the real plant. First thing to back off.
max_yaw_rate_rps = 2.0    # nose-follows-tangent ceiling; enters v_lim directly.
                          # RAISED from 1.0. At 1.0 this ceiling was forcing a
                          # near-STOP before g5: the g4->g5 leg dropped to
                          # 0.30 m/s (the v_floor) and took 9.16 s for a 12 m
                          # gap, purely so the NOSE could keep tracking the
                          # path tangent. That buys nothing for this pilot -
                          # solvers.follower reads GroundTruthSource and never
                          # touches the camera, and attitude_sticks() is
                          # yaw-agnostic for translation (it re-expresses the
                          # same world tilt in whatever body frame it has), so
                          # a lagging nose does not move the drone off its
                          # line. Measured at 2.0: leg 9.16 -> 7.83 s, min
                          # speed 0.30 -> 0.59, lap 61.7 -> 56.3 s, with g4/g5
                          # crossings unchanged (+0.189/+0.086).
                          # Kept consistent with follower.yaw_clamp below
                          # (~0.31 rad/s per 60 PWM measured => 400 PWM ~ 2.0)
a_lat_rate_max   = 6.5    # m/s^3 - attitude-slew ceiling: how fast lateral
                          # accel can CHANGE (v <= (rate/|dkappa/ds|)^(1/3)).
                          # Was TIGHTENED to 4.0 earlier to start the lean
                          # ramp before a sharp bend; RAISED to 6.5 for the
                          # 1.5x speed pass, because at 4.0 this ceiling was
                          # chopping 36-46% of the whole course - the single
                          # biggest "speed limit point" left.
                          # WARNING: measured full-amplitude slew on this
                          # plant is 6.6-7.2 (solvers.sysid_slew run C), and
                          # 5.3 was that with an 80% safety margin. 6.5 sits
                          # at ~98% of the low end - essentially NO margin.
                          # Planner-only (never touches the follower clamp),
                          # but it does mean the plan now assumes very close
                          # to the measured limit. Back off toward 5.3 first
                          # if corner entries look ragged.
v_max_mps        = 6.0    # global straight-line ("moving forwards") cap -
                          # raised from plan_003's 1.6. With anchor_standoff_
                          # turn_m widened to 5.0 below (gate 4's reversal
                          # curve is now genuinely wider, kappa there dropped
                          # 5.48->3.18): swept 2.8/3.2/3.6 - 2.8 stayed clean
                          # 12/12, 3.2/3.6 both clipped gate 5 instead (gate 4
                          # itself is no longer the limiter). Before this
                          # widening the ceiling was 2.6, so the wider curve
                          # bought +0.2 m/s before gate 5 became the new wall.
                          # max_tilt_deg untouched throughout, so the
                          # follower's real-time correction authority is
                          # unaffected. Global-only (RESTRICTIONS.md).
v_gate_mps       = 5.5    # cap within gate_window_m of ANY crossing center.
                          # RAISED from 0.8 - this, not v_max, was what held
                          # up the near-straight g0->g3 run. Those legs are
                          # 4.65/7.36/9.85 m long and every gate imposes a
                          # 2 m crawl radius, so on g0->g1 fully 4 of its
                          # 4.65 m sat at the crawl speed. Measured: raising
                          # v_max 2.8 -> 5.2 bought only 0.7 s there, while
                          # this change bought 7.8 s.
                          # It is SELECTIVE for free, the same way v_max is:
                          # at a tight gate (g4) the curvature/yaw-rate
                          # ceilings already force well under 0.8, so this
                          # cap is not the binding one there and the corner
                          # entry is nearly unchanged (g4 crossing +0.124 ->
                          # +0.159 m, still 0.59 m of margin). Only the
                          # low-curvature gates speed up.
                          # Swept: 1.2 -> 85.5 s lap, 1.6 -> 75.1 s,
                          # 2.0 -> 69.5 s, 2.5 -> 66.0 s, all 12/12 clean.
                          # 1.6 is the moderate pick; room to go higher.
gate_window_m    = 2.0    # one uniform rule, never special-cased per gate
vz_up_max        = 4.0    # measured ceiling 8.1 m/s at full throttle; margin for tilt
vz_down_max      = 3.0
a_accel_max      = 8.2   # RAISED from 4.0. The old value was sized for the
                         # OLD 22 deg tilt (g*tan22 = 3.96 ~ 4.0); with tilt
                         # now 30 deg the airframe has g*tan30 = 5.66 of
                         # along-track budget, so 4.0 had become an artificial
                         # limiter left behind by the tilt change.
a_brake_max      = 8.2   # RAISED from 5.0, same tilt-consistency reasoning

[planner]
laps = 1                  # dev iteration: one lap is the same information in half
anchor_standoff_m      = 2.0   # pre/post anchor along each crossing normal
anchor_standoff_turn_m = 2.0   # LOWERED 3.5 -> 5.0 -> 2.0. Now that
                               # LEG_BUDGET_FRAC caps every normal leg
                               # well below this (measured: 0.5-1.7 m on
                               # the real legs), this number only still
                               # bites on the ONE leg the budget rule
                               # skips - the stacked g10 pair, whose two
                               # openings share an XY position exactly and
                               # are separated 2.70 m in z alone. It was
                               # handing that 2.7 m gap 5.0 m of standoff
                               # on each side, producing a 21 m loop
                               # (7.90x its straight-line distance) and the
                               # course speed minimum. At 2.0 that loop
                               # falls to 2.56x, path 122.5 -> 107.7 m,
                               # lap 37.3 -> 30.9 s, with every other leg
                               # bit-identical (otherDetour stays 1.26x).
turn_angle_deg         = 40.0  # LOWERED from 100.0: at 100, only the g6->g7
                               # junction (in=148.4 deg) got the wider
                               # standoff - gate 4's entrance (in=43.3 deg,
                               # the reversal turn that's clipped its frame
                               # repeatedly this session) and gate 5's
                               # entrance (in=52.9) and gate 8's (in=56.0)
                               # were all classified as ordinary junctions
                               # with just the base 2.0 m run-up. At 40 deg
                               # all of those - our actual crash sites - get
                               # the wider anchor_standoff_turn_m (3.5 m)
                               # instead: more straight, aligned approach
                               # distance before the frame, not just less
                               # speed. Global rule, no per-gate anything.
sample_ds_m   = 0.25           # uniform arc-length resolution of the plan
a_lat_margin  = 0.5            # LOWERED from 0.7: this only feeds the PLANNER's
                                # curvature speed ceiling (a_lat_planner =
                                # margin * a_lat_full) - a_lat_full itself
                                # (the FOLLOWER's real-time correction clamp)
                                # depends only on max_tilt_deg and is
                                # untouched, unlike lowering tilt directly
                                # (tried before: that weakened correction
                                # authority and caused a new crash). This
                                # makes the PLAN noticeably more cautious
                                # through every hairpin/curve while the
                                # follower keeps full authority to hold it.
takeoff_alt_m = 1.35           # first anchor above the spawn point
v_floor_mps   = 0.3            # numerical floor for the profile/timestamps

[optimizer]               # racing-line optimizer (raceline.line_opt)
apex_max_m = 0.40         # 0.75 window minus measured ~0.35 tracking error
                          # (0.55 lost lap-2 g0 by ~3 cm: line legal, flying
                          # fine, the SUM over the edge)

[follower]
kp_pos      = 1.2       # position error -> accel. NOT raised: 1.8 was tried
                        # and crashed at g5 - the proportional term alone
                        # overshoots. Damping (kd_pos) is the lever instead.
kd_pos      = 4.0       # velocity error (vs plan) -> accel. RAISED
                        # 2.1 -> 2.8 -> 3.6 -> 4.0. Damping, not
                        # stiffness: it opposes error that is still
                        # growing, so it kills the overshoot that speed
                        # creates. Raising the PROPORTIONAL gain kp_pos
                        # instead was tried and crashed at g5.
                        # This step pays for the tighter g10 geometry:
                        # worst gate crossing 0.259 -> 0.198 m, i.e.
                        # better than before the tightening (0.236).
                        # HEADROOM: 4.2 crashed at g7 back when tilt was
                        # 30; at tilt 40 the edge has moved and 4.4/4.8/
                        # 5.4 all pass in sim_lite with progressively
                        # better numbers. NOT chasing those: sim_lite has
                        # no attitude dynamics, and lag-driven oscillation
                        # from high derivative gain is exactly what it
                        # cannot see. Back off to 3.2 if it wobbles.
lookahead_m = 0.8       # arc-length carrot distance - SHORTENED from 1.5.
                        # A near carrot makes the drone hug the reference
                        # line; a far one lets it aim across the apex and cut
                        # the corner. (Consistent with the earlier finding
                        # that LENGTHENING this to 2.5 made gate 4 worse -
                        # this is the same effect in the useful direction.)
lookahead_t = 0.3       # seconds of warning; carrot = max(lookahead_m, t*v).
                        # At v_max 2.8 the two terms are ~equal, so the
                        # carrot sits ~0.85 m ahead - tight tracking without
                        # going to a pure pursuit-the-nearest-point rule.
ka_att      = 300.0   # was 120: starved the tilt loop (max ~45 PWM); A-B tested 2026-08-28
stick_clamp = 250     # RAISED 45 -> 150 -> 250. At ka_att 300 a
                      # 40 deg tilt command needs ~192 PWM, so 150
                      # would silently clip it and the follower
                      # could not deliver the authority max_tilt_deg
                      # promises the planner. sim_lite cannot test
                      # this (no attitude model) - watch for wobble.
kp_z        = 140.0     # altitude loop (proven), plus plan vz feedforward
kd_z        = 45.0
ki_z        = 8.0
kyaw        = 200.0     # yaw error (rad) -> stick PWM
yaw_clamp   = 400       # RAISED from 200 to stay consistent with the
                        # raised limits.max_yaw_rate_rps (2.0): ~0.31 rad/s
                        # per 60 PWM measured => 400 PWM ~ 2.0 rad/s, so the
                        # nose can actually deliver what the plan assumes
yaw_lookahead_m = 3.0   # aim the nose at the tangent this far ahead
takeoff_pwm = 1330
min_alt_translation_m = 1.0
