# LADDER RUNG k=0.000 generated by raceline.ladder from vehicle_cam35_75.toml; only max_tilt_deg / v_max_mps / a_lat_rate_max / a_lat_margin differ from the race config. Camera 35_75 (mount_lens deg): plan tilt capped at 50.3 deg.
# config/vehicle.toml - THE tuning surface for the racing-line stack.
# Planner (raceline.planner) and follower (solvers.follower) read ONLY this
# file. No vehicle number is hardcoded anywhere else. Every parameter is
# GLOBAL: there is no way to express a per-gate value here, by design
# (RESTRICTIONS.md).
# Seeds: hover_pwm is measured on the elodin SITL plant; everything else is a
# conservative starting point for the first 24/24 confirmation flight. Tune by
# editing this file and re-running race.py - nothing else.

[meta]
name    = "elodin-sitl-quad"        # becomes "neros-..." when day-1 sysid lands
updated = "2026-09-09"

[vehicle]                 # physical truth - sysid replaces this section wholesale
mass_kg   = 1.751        # ALL-UP, weighed with props and prop protection 2026-09-20 (1.59 bare)
drag_lin  = 0.0           # N per (m/s)
drag_quad = 0.23          # N per (m/s)^2 - MEASURED by solvers.sysid_sprint
drag_quad_z = 0.45        # N per (m/s)^2 on the WORLD-vertical component: the
                          # plant's drag is anisotropic (physics.py linear_drag
                          # [0.2, 0.2, 0.4] on 0.8 kg), so a climb at speed pays
                          # twice the horizontal coefficient. Fitted from flown
                          # kinematics (race_084/race_121, 2026-09-10): kz 0.45-0.5
                          # 1/m against 0.256 horizontal; the isotropic model
                          # under-read the g9-g10-top climb load by ~5 m/s^2.
                          # Optional in older tomls (defaults to drag_quad).
                          # (out/sysid/sprint_000.csv, 2026-09-09): constant-tilt
                          # sprints at 30/45/58/68 deg reached terminal speeds
                          # 4.7/6.2/8.2/9.7 m/s; equivalent loss fits
                          # a = 0.257*v^2 m/s^2 (pure quadratic, rms 0.6). The
                          # sim plant IS quadratic drag (physics.py: F=-k|v|v,
                          # k=0.2 in the default profile) so the model shape
                          # is exact; 0.23 = 0.9 kg * 0.257. Consequence: the
                          # airframe cannot exceed ~9.7 m/s at max tilt, and
                          # coasting level at 8 m/s already decelerates at
                          # ~17 m/s^2. The physical drone will differ - day-1
                          # sprint re-measures this.

[thrust]
hover_pwm = 1291          # MEASURED, organizers' blackbox, 4 flights, 2026-09-19 (was 1240, a SITL value)
pwm_min   = 1000
pwm_max   = 2000          # was 1600 (wobble-era cap, never measured); full range,
                          # real ceiling comes from solvers.sysid_thrust
# Thrust curve: pwm -> specific thrust of a LEVEL drone (m/s^2; hover = g).
# CONSUMED by the follower: rc_backend.AltitudeLoop inverts this table to
# turn its commanded thrust into a throttle PWM, so it must be strictly
# increasing and bracket hover_pwm.
# MEASURED from sysid_thrust thrust_002 (aerobatic-tune plant, 2026-09-08)
# as the PEAK net accel ~0.1 s after each raw step, plus g. The earlier
# values here (14.49 .. 28.42) came from the analyzer's 0.4 s average,
# which already includes the plant's strong climb-speed thrust loss
# (measured: net accel at 2000 PWM falls from +27 at 0.1 s to +4 at 0.5 s
# as vz builds toward the 8 m/s ceiling), so they understated the
# instantaneous thrust by 15-40 percent. The follower's loop lives at
# vz ~ 0, where THIS curve applies; the vz loss acts as ~1.1 1/s of
# natural damping there. 1000 -> 0 is an assumption (motor idle).
curve_pwm = [1000, 1150, 1291, 1450, 1600, 1800, 2000]
curve_acc = [0.00, 2.95, 9.81, 18.33, 27.15, 40.07, 54.33]   # MEASURED: |accSmooth|/acc_1G over 76k airborne samples, weighted quadratic anchored at hover=1g, residual 0.29 m/s^2 over 1150-1650. 1800/2000 extrapolated. The old SITL curve read 12.77 m/s^2 at 1291, a 30 % thrust over-estimate.

[limits]
# LEVERS at their race values. raceline.ladder --k scales them between a safe floor (k = 0) and these (k = 1);
# the time is whatever the solve gives. Flown clean on vision: k = 0.33 (50 s).
cam_tilt_deg         = 35.0   # camera mount above body forward; with cam_hfov_deg the planner solves for
cam_hfov_deg         = 75.0   # the fastest plan this camera can fly (tilt clamp + look window). Measure with camcal.
v_blind_turn_mps     = 0.0    # blind turns: speed cap within blind_turn_window_m before a crossing whose heading
blind_turn_window_m  = 6.0    # differs from the previous one by more than blind_turn_deg (the hairpin, the stack).
blind_turn_deg       = 110.0  # The camera cannot hold such a gate on the way in; the estimate arrives blind.                  # ceilings shared by planner AND follower
max_tilt_deg     = 20.000   # NO LIMIT (config validator caps at 89.5) (Brian, feature/rip): the thrust-vector budget is the only bound - at 90 the vertical thrust is zero, so the model allows it only for the instant the thrust vector affords, and the follower's mapping floor (0.5 g) caps the commanded tilt near 82.
                          # (~70 deg, TWR 2.9) applies when FIGHTING to stay
                          # level from a lift deficit - but when the drone is
                          # already high/climbing, pitching forward past that
                          # is exactly right: it dumps the excess altitude
                          # into forward speed (flight 2026-09-09: climbing
                          # into every gate top, needed much more forward
                          # pitch). LIMITED by thrust: holding
                          # altitude at tilt t needs thrust >= weight/cos(t),
                          # and max thrust is ~3x weight (TWR ~3), so above
                          # ~70 deg the drone cannot hold altitude and falls
                          # out of the bank (flight 2026-09-08: lost altitude
                          # banking hard for g2, could not climb). 60 leaves
                          # climb margin (needs TWR 2 of the ~3 available) yet
                          # still doubles cornering accel vs 40 (g*tan60=17).
                          # This is the follower's real-time correction
                          # clamp (a_lat_full = g*tan(this)): 3.96 -> 5.66
                          # -> 8.23 m/s^2. More lean = more authority to
                          # pull back onto the line mid-curve, which is
                          # what let the gate crossings hold steady while
                          # speed went up 1.5x. Thrust supports it: holding
                          # altitude at 40 deg needs 1/cos(40) = 1.31x
                          # hover, fine at the measured TWR ~3.
                          # Direction matters - LOWERING this to 16 was
                          # tried early on and caused a NEW crash at g8,
                          # because it cuts that same authority.
                          # NOTE follower.stick_clamp was raised to 250 in
                          # step: at ka_att 300 a 40 deg command needs
                          # ~192 PWM, so the old clamp of 150 would have
                          # stopped the follower delivering what the
                          # planner assumes here.
                          # CAVEAT: sim_lite has no attitude dynamics, so
                          # it cannot confirm 40 deg is actually reachable
                          # on the real plant. First thing to back off.
max_yaw_rate_rps = 8.0    # nose-follows-tangent ceiling; enters v_lim directly.
                          # RAISED 2 -> 8: this was slowing bent-gate crossings
                          # ~19% of the course purely to let the NOSE keep up,
                          # but thrust-vector translation is yaw-agnostic (the
                          # drone banks, it does not need the nose pointed), so
                          # a lagging nose does not push it off line.
                          # RAISED from 1.0. At 1.0 this ceiling was forcing a
                          # near-STOP before g5: the g4->g5 leg dropped to
                          # 0.30 m/s (the v_floor) and took 9.16 s for a 12 m
                          # gap, purely so the NOSE could keep tracking the
                          # path tangent. That buys nothing for this pilot -
                          # solvers.follower reads GroundTruthSource and never
                          # touches the camera, and attitude_sticks() is
                          # yaw-agnostic for translation (it re-expresses the
                          # same world tilt in whatever body frame it has), so
                          # a lagging nose does not move the drone off its
                          # line. Measured at 2.0: leg 9.16 -> 7.83 s, min
                          # speed 0.30 -> 0.59, lap 61.7 -> 56.3 s, with g4/g5
                          # crossings unchanged (+0.189/+0.086).
                          # Kept consistent with follower.yaw_clamp below
                          # (~0.31 rad/s per 60 PWM measured => 400 PWM ~ 2.0)
a_lat_rate_max   = 40.000   # MEASURED CEILING (organizers' blackbox, step-response flight, 2026-09-19): peak roll rate p99 443 deg/s = 152 m/s^3 of lateral-accel slew at 45 deg tilt. Was 165, which no logged flight ever demonstrated. For scale, the human's CLEAN RACE LAP used 27 m/s^3 (roll rate 79 deg/s) - the ladder's low rungs already ask 3x what a winning human lap needed.
                          # accel can change. MEASURED by solvers.sysid_slew
                          # (slew_009, 2026-09-08) AFTER applying the aerobatic
                          # Betaflight tune to the eeprom (rc_rate 140, srate
                          # 78, stock PIDs, full stick): full-amplitude peak
                          # rate 206-295, recommend 165. The earlier ~15-20
                          # readings were the bone-stock eeprom - configure_
                          # betaflight.py is a manual step the headless sim
                          # never ran, so the drone was fully sandbagged.
                          # Same run: 17 m/s^2 command now ACHIEVES 32 (banks
                          # ~73 deg fast) - so corner ENTRY is no longer slew-
                          # limited; corner speed is set by the altitude-hold
                          # tilt (max_tilt) and the thrust budget.
                          # accel can CHANGE (v <= (rate/|dkappa/ds|)^(1/3)).
                          # Was TIGHTENED to 4.0 earlier to start the lean
                          # ramp before a sharp bend; RAISED to 6.5 for the
                          # 1.5x speed pass, because at 4.0 this ceiling was
                          # chopping 36-46% of the whole course - the single
                          # biggest "speed limit point" left.
                          # WARNING: measured full-amplitude slew on this
                          # plant is 6.6-7.2 (solvers.sysid_slew run C), and
                          # 5.3 was that with an 80% safety margin. 6.5 sits
                          # at ~98% of the low end - essentially NO margin.
                          # Planner-only (never touches the follower clamp),
                          # but it does mean the plan now assumes very close
                          # to the measured limit. Back off toward 5.3 first
                          # if corner entries look ragged.
v_max_mps        = 5.000   # global straight-line ("moving forwards") cap -
                          # raised from plan_003's 1.6. With anchor_standoff_
                          # turn_m widened to 5.0 below (gate 4's reversal
                          # curve is now genuinely wider, kappa there dropped
                          # 5.48->3.18): swept 2.8/3.2/3.6 - 2.8 stayed clean
                          # 12/12, 3.2/3.6 both clipped gate 5 instead (gate 4
                          # itself is no longer the limiter). Before this
                          # widening the ceiling was 2.6, so the wider curve
                          # bought +0.2 m/s before gate 5 became the new wall.
                          # max_tilt_deg untouched throughout, so the
                          # follower's real-time correction authority is
                          # unaffected. Global-only (RESTRICTIONS.md).
v_gate_mps       = 20.0   # = v_max: a straight-through gate is just track,
                          # never slow at the crossing itself. Bent gates are
                          # still limited by their curvature, not this cap.
                          # (was capping every crossing at 8.) With the lane
                          # straightener crossing aligned runs at the hole
                          # edges, a straight-through gate is just track -
                          # no reason to slow below v_max there. Bent gates
                          # stay governed by curvature/slew as before.
                          # Original comment for 5.5 follows.
                          # cap within gate_window_m of ANY crossing center.
                          # RAISED from 0.8 - this, not v_max, was what held
                          # up the near-straight g0->g3 run. Those legs are
                          # 4.65/7.36/9.85 m long and every gate imposes a
                          # 2 m crawl radius, so on g0->g1 fully 4 of its
                          # 4.65 m sat at the crawl speed. Measured: raising
                          # v_max 2.8 -> 5.2 bought only 0.7 s there, while
                          # this change bought 7.8 s.
                          # It is SELECTIVE for free, the same way v_max is:
                          # at a tight gate (g4) the curvature/yaw-rate
                          # ceilings already force well under 0.8, so this
                          # cap is not the binding one there and the corner
                          # entry is nearly unchanged (g4 crossing +0.124 ->
                          # +0.159 m, still 0.59 m of margin). Only the
                          # low-curvature gates speed up.
                          # Swept: 1.2 -> 85.5 s lap, 1.6 -> 75.1 s,
                          # 2.0 -> 69.5 s, 2.5 -> 66.0 s, all 12/12 clean.
                          # 1.6 is the moderate pick; room to go higher.
gate_window_m    = 2.0    # one uniform rule, never special-cased per gate
vz_up_max        = 1.25   # VISION: climbing while turning steals thrust from the turn; at 2.5 the stack top was crossed 0.35 m off even on ground truth   # flown clean (race_053); 3.0 and 3.5 fail the calibrated replay at g10-top
                          # 6-7 m/s forward the drone managed 2.0-2.2 m/s with the
                          # motors at 100% (35 m/s^2 commanded) and arrived 0.4 m
                          # low; 8.1 m/s is the hover climb ceiling, not the one at
                          # racing speed against drag. history: measured ceiling 8.1 m/s at full throttle; margin for tilt
vz_down_max      = 5.0   # back to the flown value: the calibrated replay (80% thrust, 0.06 s lag) could not follow plans built at 8.0   # UNTESTED-MAX (feature/rip): was 5.0.     # RAISED 3.0 -> 5.0 (2026-09-09). The planner note
                          # that this knob "does nothing" dates from slew 5.3;
                          # at slew 165 it bound 35 pct of the stacked-gate
                          # drop (the plan sat at exactly -3.00 m/s for 0.9 s,
                          # a vertical elevator). Descent itself is free-fall
                          # limited; arresting 5 m/s in the 2 m stub needs
                          # 6.3 m/s^2 = 1.6 g, well inside the measured
                          # curve. Model: stack leg 1.82 -> 1.61 s per lap.
a_accel_max      = 20.0   # back to the flown value: the calibrated replay (80% thrust, 0.06 s lag) could not follow plans built at 33.0   # UNTESTED-MAX (feature/rip): was 20.0. thrust-limited horizontal.   # UNCAPPED (feature/uncapped, 2026-09-10): was 12.0.   # forward-accel budget = how hard it pitches to
                         # gain speed. RAISED 14 -> 30: at 14 the pitch
                         # command was only atan(14/g)=55 deg and the drone
                         # flew too flat/high; 30 commands atan(30/g)=72 deg
                         # of forward pitch to drive speed and shed the climb.
                         # gain speed on a straight (10 m/s peak was "barely
                         # pitching"). RAISED from 4.0. The old value was sized for the
                         # OLD 22 deg tilt (g*tan22 = 3.96 ~ 4.0); with tilt
                         # now 30 deg the airframe has g*tan30 = 5.66 of
                         # along-track budget, so 4.0 had become an artificial
                         # limiter left behind by the tilt change.
a_brake_max      = 20.0   # back to the flown value: the calibrated replay (80% thrust, 0.06 s lag) could not follow plans built at 33.0   # UNTESTED-MAX (feature/rip): was 20.0. thrust-limited horizontal.   # UNCAPPED (feature/uncapped, 2026-09-10): was 12.0.   # RAISED from 5.0, same tilt-consistency reasoning

[planner]
centred_crossings = true   # every gate through its centre: the per-gate pose knobs were searched for ground truth
laps = 2                  # VADR-TS-004 scores 2-lap runs; the lap boundary
                          # (g10-low back up to g0) is the untested piece of
                          # the 1-lap-verified baseline (12/12 at 40.7 s,
                          # race_007_intern_1lap, 2026-09-08)
anchor_standoff_m      = 2.0   # pre/post anchor along each crossing normal
anchor_standoff_turn_m = 2.0   # LOWERED 3.5 -> 5.0 -> 2.0. Now that
                               # LEG_BUDGET_FRAC caps every normal leg
                               # well below this (measured: 0.5-1.7 m on
                               # the real legs), this number only still
                               # bites on the ONE leg the budget rule
                               # skips - the stacked g10 pair, whose two
                               # openings share an XY position exactly and
                               # are separated 2.70 m in z alone. It was
                               # handing that 2.7 m gap 5.0 m of standoff
                               # on each side, producing a 21 m loop
                               # (7.90x its straight-line distance) and the
                               # course speed minimum. At 2.0 that loop
                               # falls to 2.56x, path 122.5 -> 107.7 m,
                               # lap 37.3 -> 30.9 s, with every other leg
                               # bit-identical (otherDetour stays 1.26x).
turn_angle_deg         = 40.0  # LOWERED from 100.0: at 100, only the g6->g7
                               # junction (in=148.4 deg) got the wider
                               # standoff - gate 4's entrance (in=43.3 deg,
                               # the reversal turn that's clipped its frame
                               # repeatedly this session) and gate 5's
                               # entrance (in=52.9) and gate 8's (in=56.0)
                               # were all classified as ordinary junctions
                               # with just the base 2.0 m run-up. At 40 deg
                               # all of those - our actual crash sites - get
                               # the wider anchor_standoff_turn_m (3.5 m)
                               # instead: more straight, aligned approach
                               # distance before the frame, not just less
                               # speed. Global rule, no per-gate anything.
sample_ds_m   = 0.25           # uniform arc-length resolution of the plan
a_lat_margin  = 0.700   # the flown 32.1 s line (race_061) uses 0.6; 0.9 flew 32.40 (race_062) - not a lever at tilt 89
                               # 0.55 -> 0.75 -> eased to 0.6 while the
                               # attitude gain is retuned for the fast plant
                               # (0.75 corners fed the oscillation).
                               # slew is a measured 165
                               # (the drone banks fast enough to hold an
                               # aggressive corner) and tilt-comp holds
                               # altitude - the earlier low margin was
                               # protecting against the SANDBAGGED slew.
                               # This only feeds the PLANNER's
                                # curvature speed ceiling (a_lat_planner =
                                # margin * a_lat_full) - a_lat_full itself
                                # (the FOLLOWER's real-time correction clamp)
                                # depends only on max_tilt_deg and is
                                # untouched, unlike lowering tilt directly
                                # (tried before: that weakened correction
                                # authority and caused a new crash). This
                                # makes the PLAN noticeably more cautious
                                # through every hairpin/curve while the
                                # follower keeps full authority to hold it.
takeoff_alt_m = 1.35           # first anchor above the spawn point
v_floor_mps   = 0.3            # numerical floor for the profile/timestamps
reversal_climb_m = 0.0         # 3D REVERSAL (wingover): at a hairpin the drone
                               # climbs this high over the turn instead of a
                               # flat tight U. Climbing bleeds speed into
                               # altitude (gravity brakes for free), the turn
                               # happens slow at the top where a tight radius
                               # is natural, then the descent gives speed back.
                               # 0.0 = flat reversal (old behaviour).

[optimizer]               # racing-line optimizer (raceline.line_opt)
apex_max_m = 0.25         # MARGIN LAW: 0.60 effective window (0.75 - 0.15
                          # drone) minus MEASURED tracking error. 2026-09-09
                          # race_001/002.csv: 0.27-0.30 m lateral error at
                          # g1/g2 on the aerobatic plant -> 0.25 leaves
                          # ~0.05 m. Was 0.40 (sized on 0.16 m error from
                          # 2026-09-03); 0.40 + 0.28 touched g1's post three
                          # flights running. Same number as the planner's
                          # lane straightener (_LANE_USE_M) - they share the
                          # budget. (0.55 lost lap-2 g0 by ~3 cm earlier: the
                          # SUM is what goes over the edge.)

[follower]
kp_pos      = 4.0       # RAISED 1.2 -> 4.0 (2026-09-09, race_037): with the
                        # attitude loop at ka 600 / kw 10 (3x faster) the
                        # drone still sat a constant 0.6-0.8 m OUTSIDE every
                        # curve (g3-g4 and the whole g4-g5 arc, then g5's
                        # post) - at 1.2 a 0.7 m error asks for 0.8 m/s^2.
                        # 4.0 with kd 4.0 is critically damped, ~3x stiffer.
                        # history: position error -> accel. NOT raised: 1.8 was tried
                        # and crashed at g5 - the proportional term alone
                        # overshoots. Damping (kd_pos) is the lever instead.
kd_pos      = 4.0       # velocity error (vs plan) -> accel. RAISED
                        # 2.1 -> 2.8 -> 3.6 -> 4.0. Damping, not
                        # stiffness: it opposes error that is still
                        # growing, so it kills the overshoot that speed
                        # creates. Raising the PROPORTIONAL gain kp_pos
                        # instead was tried and crashed at g5.
                        # This step pays for the tighter g10 geometry:
                        # worst gate crossing 0.259 -> 0.198 m, i.e.
                        # better than before the tightening (0.236).
                        # HEADROOM: 4.2 crashed at g7 back when tilt was
                        # 30; at tilt 40 the edge has moved and 4.4/4.8/
                        # 5.4 all pass in sim_lite with progressively
                        # better numbers. NOT chasing those: sim_lite has
                        # no attitude dynamics, and lag-driven oscillation
                        # from high derivative gain is exactly what it
                        # cannot see. Back off to 3.2 if it wobbles.
lookahead_m = 0.8       # arc-length carrot distance - SHORTENED from 1.5.
                        # A near carrot makes the drone hug the reference
                        # line; a far one lets it aim across the apex and cut
                        # the corner. (Consistent with the earlier finding
                        # that LENGTHENING this to 2.5 made gate 4 worse -
                        # this is the same effect in the useful direction.)
lookahead_t = 0.3       # seconds of warning; carrot = max(lookahead_m, t*v).
                        # At v_max 2.8 the two terms are ~equal, so the
                        # carrot sits ~0.85 m ahead - tight tracking without
                        # going to a pure pursuit-the-nearest-point rule.
kw_att      = 10.0    # LOWERED 25 -> 10 (2026-09-09, slew_016 with sticks and
                      # body rates logged): the plant gives ~0.02 rad/s per
                      # PWM of stick with ~80 ms lag, so this PD loop's time
                      # constant is (1 + g*kw)/(g*ka): 0.3 s at 250/25 (90%
                      # in 0.7 s, every step of slew_010-016, race_030-032
                      # 2-3 m wide of g4), 0.1 s at 600/10. Betaflight PIDs,
                      # feedforward and the rate map were each changed and
                      # measured to make no difference - the limit was here.
                      # attitude RATE-damping gain (rad/s of body roll/pitch
                      # rate -> opposing stick). Damps the fast aerobatic
                      # plant so the proportional attitude loop stops
                      # overshooting/hunting - the proper fix for the pitch
                      # fwd/back oscillation, vs just lowering ka_att into
                      # sluggishness. Raise if still hunting, lower if it
                      # feels heavy. Lets ka_att stay responsive.
ka_att      = 600.0   # RAISED 250 -> 600 (slew_016, see kw_att): 250 -> 120 -> 250 history:
                      # g3-g4 arc the thrust vector had to swing ~80 deg
                      # (68 deg forward -> 62 deg sideways); the loop put
                      # only ~55 PWM on the roll stick (120*sin(err) minus
                      # kw_att*rate), the body rolled at 90-125 deg/s, the
                      # cross-track accel built at 16 m/s^3 against the
                      # planner's 165, and the drone ran 2.6 m wide. Motors
                      # were NOT saturated (m_max 0.6-0.9). Steady rotation
                      # rate of this PD loop ~ ka_att*err/kw_att: 250/25
                      # gives 10 rad/s at a 1 rad error. Verify with
                      # solvers.sysid_slew before racing on it.
                      # history: 300 -> 150 -> 60 -> 120:
                      # with rate damping (kw_att) added, ka_att can come
                      # BACK UP for responsiveness without oscillating -
                      # the damping, not a low P, is what kills the hunt.
                      # this is a proportional-only attitude loop (no rate
                      # damping), and with the aerobatic plant (slew 165)
                      # a gain of 300 snaps past the target and HUNTS
                      # (pitch fwd/back oscillation, ballooning into gate
                      # tops). This is NOT reducing authority - the drone
                      # still banks to max_tilt when the error is large;
                      # it just stops overshooting small errors. Retune
                      # with flight (lower if still hunting, raise if
                      # sluggish). was 120: starved the tilt loop (max ~45 PWM).
stick_clamp = 500     # FULL stick authority (center 1500, throw +-500).
                      # 250 was half-authority - the follower could only
                      # command half-rate rolls/pitches, so the acro
                      # airframe flew like a trainer and sysid measured a
                      # sluggish 15-22 slew. The real drone is aerobatic;
                      # 500 lets the follower use the whole stick so it can
                      # rotate as fast as Betaflight's rate loop allows.
                      # RAISED 45 -> 150 -> 250 -> 500. Watch for wobble
                      # (high derivative-free authority can oscillate);
                      # re-measure with sysid_slew after this.
kp_z        = 9.0       # altitude loop, ACCEL UNITS (m/s^2 per m of error).
                        # The loop now commands a vertical acceleration and
                        # goes through the measured [thrust] curve and the
                        # actual tilt (rc_backend.AltitudeLoop), so these
                        # gains are physical and independent of throttle
                        # range and bank angle. 9.0 = the proven old
                        # stiffness re-expressed: 140 PWM/m x 0.063 m/s^2
                        # per PWM (measured slope just above hover) = 8.8.
                        # Natural frequency sqrt(9) = 3 rad/s.
kd_z        = 4.0       # vertical-velocity damping (m/s^2 per m/s), acting
                        # on the error vs the plan's vz feedforward. Sized
                        # from the fitted vertical model (thrust_002 steps,
                        # validated against that run's own closed-loop
                        # takeoff to within 0.1 m): the plant adds ~1.1 1/s
                        # of climb-speed damping by itself, so 4.0 + 1.1
                        # gives zeta = 0.85 at 3 rad/s. Model prediction
                        # (unverified): 0.5 m step overshoots 0.02 m and
                        # settles in 1.0 s; a 1 s pulse to 64 deg of tilt
                        # moves altitude 0.05 m (old loop: 1.3 m). The
                        # old-units 45 -> 130 step tried on 2026-09-09 is
